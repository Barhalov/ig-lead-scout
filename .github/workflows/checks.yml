name: Parser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python setup_local.py
      - run: python -m unittest test_bridge.py test_portable.py
      - run: node test_quick_profile.cjs
      - run: node test_bio.cjs
      - run: node test_filtered_list.cjs
      - run: node test_idle_recovery.cjs
